[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini305-rgbd-panorama"
dynamic = ["version"]
description = "Fail-closed Gemini 305 RGB-D side-scan panorama pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "open3d>=0.19,<0.20",
    "opencv-python>=4.8",
    "OpenEXR>=3.3,<4",
    "PyYAML>=6.0",
    "xatlas>=0.0.11",
]

[project.optional-dependencies]
capture = ["pyorbbecsdk2>=2.1.1"]
test = ["pytest>=8.0"]
cuda13 = ["cupy-cuda13x>=14.1,<15"]
unistitch-diagnostic = [
    "kornia>=0.7",
    "torch>=2.1",
    "torchvision>=0.16",
]

[project.scripts]
g305-capture = "panorama_demo.capture_orbbec:main"
g305-panorama = "panorama_demo.stitch_sequence:main"
g305-video-panorama = "panorama_demo.video_panorama:main"
g305-video-experiment = "panorama_demo.video_experiment:main"
g305-video-freeze-trajectory = "panorama_demo.video_trajectory_cache:main"
g305-video-benchmark = "panorama_demo.video_benchmark:main"
g305-video-replay = "panorama_demo.video_replay:main"
g305-video-evaluate = "panorama_demo.video_offline_evaluation:main"
g305-generate-user-20m-test = "panorama_demo.video_holdout:main"
g305-video-3d = "panorama_demo.video_3d:main"
g305-orbslam3-trajectory = "panorama_demo.export_orbslam3_trajectory:main"
g305-central-strip-diagnostic = "panorama_demo.central_strip_diagnostic:main"
g305-geometry-pair-diagnostic = "panorama_demo.geometry_pair_diagnostic:main"
g305-foreground-deformation-diagnostic = "panorama_demo.foreground_deformation_diagnostic:main"
unistitch-pair = "panorama_demo.stitch_pair:main"
unistitch-sequence = "panorama_demo.stitch_sequence:main"
generate-panorama-demo = "panorama_demo.synthetic:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "panorama_demo.version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
