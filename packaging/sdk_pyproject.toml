[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini305-rgbd-panorama"
dynamic = ["version"]
description = "Gemini 305 RGB-D panorama SDK"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "open3d>=0.19,<0.20",
    "opencv-python>=4.8",
    "OpenEXR>=3.3,<4",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
capture = ["pyorbbecsdk2>=2.1.1"]
cuda13 = ["cupy-cuda13x>=14.1,<15"]

[project.scripts]
g305-panorama = "panorama_demo.stitch_sequence:main"
generate-panorama-demo = "panorama_demo.synthetic:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "panorama_demo.version.__version__"}
